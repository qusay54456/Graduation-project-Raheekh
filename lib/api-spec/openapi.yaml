openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ParkNow - Parking Reservation System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: lots
  - name: spots
  - name: reservations
  - name: dashboard
  - name: users
  - name: ratings
  - name: profile
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400": { description: Bad request, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "409": { description: Email already in use, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401": { description: Invalid credentials, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }
        "429": { description: Too many login attempts, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordBody"
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponse"

  /auth/verify-code:
    post:
      operationId: verifyResetCode
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyCodeBody"
      responses:
        "200":
          description: Code valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400": { description: Invalid or expired code, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400": { description: Invalid code, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /profile:
    patch:
      operationId: updateProfile
      tags: [profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401": { description: Unauthorized, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorResponse" } } } }

  /lots:
    get:
      operationId: getLots
      tags: [lots]
      parameters:
        - { name: lat, in: query, schema: { type: ["number", "null"] } }
        - { name: lng, in: query, schema: { type: ["number", "null"] } }
        - { name: search, in: query, schema: { type: ["string", "null"] } }
        - { name: maxPrice, in: query, schema: { type: ["number", "null"] } }
        - { name: minAvailable, in: query, schema: { type: ["integer", "null"] } }
      responses:
        "200":
          description: List of parking lots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ParkingLotWithStats"
    post:
      operationId: createLot
      tags: [lots]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLotBody"
      responses:
        "201":
          description: Lot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkingLot"

  /lots/{id}:
    get:
      operationId: getLot
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Parking lot with spots
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkingLotWithSpots"
        "404": { description: Not found }
    patch:
      operationId: updateLot
      tags: [lots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLotBody"
      responses:
        "200":
          description: Updated lot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParkingLot"

  /lots/{id}/spots:
    get:
      operationId: getLotSpots
      tags: [spots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: List of spots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Spot"

  /lots/{id}/ratings:
    get:
      operationId: getLotRatings
      tags: [ratings]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: List of ratings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RatingWithUser"

  /spots/{id}:
    patch:
      operationId: updateSpot
      tags: [spots]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSpotBody"
      responses:
        "200":
          description: Updated spot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spot"

  /reservations:
    get:
      operationId: getReservations
      tags: [reservations]
      responses:
        "200":
          description: List of reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationWithDetails"
    post:
      operationId: createReservation
      tags: [reservations]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationBody"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationWithDetails"

  /reservations/{id}:
    get:
      operationId: getReservation
      tags: [reservations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Reservation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationWithDetails"

  /reservations/{id}/cancel:
    patch:
      operationId: cancelReservation
      tags: [reservations]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: Cancelled reservation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationWithDetails"

  /reservations/{id}/rate:
    post:
      operationId: rateReservation
      tags: [ratings]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRatingBody"
      responses:
        "201":
          description: Rating created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/reservations:
    get:
      operationId: getDashboardReservations
      tags: [dashboard]
      parameters:
        - { name: status, in: query, schema: { type: ["string", "null"] } }
        - { name: lotId, in: query, schema: { type: ["integer", "null"] } }
        - { name: dateFrom, in: query, schema: { type: ["string", "null"] } }
        - { name: dateTo, in: query, schema: { type: ["string", "null"] } }
      responses:
        "200":
          description: All reservations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReservationWithDetails"

  /dashboard/users:
    get:
      operationId: listUsers
      tags: [users]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /dashboard/users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /dashboard/revenue:
    get:
      operationId: getRevenue
      tags: [dashboard]
      parameters:
        - { name: period, in: query, schema: { type: ["string", "null"] } }
      responses:
        "200":
          description: Revenue series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueResponse"

  /dashboard/popular-lots:
    get:
      operationId: getPopularLots
      tags: [dashboard]
      responses:
        "200":
          description: Popular lots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PopularLot"

  /dashboard/peak-hours:
    get:
      operationId: getPeakHours
      tags: [dashboard]
      responses:
        "200":
          description: Peak hours data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PeakHour"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

    MessageResponse:
      type: object
      properties:
        message: { type: string }
      required: [message]

    RegisterBody:
      type: object
      properties:
        name: { type: string }
        email: { type: string }
        password: { type: string }
        phone: { type: ["string", "null"] }
        role: { type: string, enum: [user, supervisor] }
      required: [name, email, password]

    LoginBody:
      type: object
      properties:
        email: { type: string }
        password: { type: string }
      required: [email, password]

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        role: { type: string }
        phone: { type: ["string", "null"] }
        profilePhotoUrl: { type: ["string", "null"] }
        isBlocked: { type: boolean }
        createdAt: { type: string }
      required: [id, name, email, role, isBlocked, createdAt]

    AuthResponse:
      type: object
      properties:
        user: { $ref: "#/components/schemas/User" }
        message: { type: string }
      required: [user, message]

    ForgotPasswordBody:
      type: object
      properties:
        email: { type: string }
      required: [email]

    ForgotPasswordResponse:
      type: object
      properties:
        message: { type: string }
        devCode: { type: ["string", "null"] }
      required: [message]

    VerifyCodeBody:
      type: object
      properties:
        email: { type: string }
        code: { type: string }
      required: [email, code]

    ResetPasswordBody:
      type: object
      properties:
        email: { type: string }
        code: { type: string }
        newPassword: { type: string }
      required: [email, code, newPassword]

    UpdateProfileBody:
      type: object
      properties:
        name: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        profilePhotoUrl: { type: ["string", "null"] }

    UpdateUserBody:
      type: object
      properties:
        role: { type: ["string", "null"], enum: [user, supervisor, null] }
        isBlocked: { type: ["boolean", "null"] }

    ParkingLot:
      type: object
      properties:
        id: { type: integer }
        ownerId: { type: integer }
        name: { type: string }
        location: { type: string }
        totalSpots: { type: integer }
        lat: { type: number }
        lng: { type: number }
        pricePerHour: { type: number }
        isActive: { type: boolean }
        createdAt: { type: string }
      required: [id, ownerId, name, location, totalSpots, lat, lng, pricePerHour, isActive, createdAt]

    ParkingLotWithStats:
      allOf:
        - $ref: "#/components/schemas/ParkingLot"
        - type: object
          properties:
            availableSpots: { type: integer }
            reservedSpots: { type: integer }
            occupiedSpots: { type: integer }
            distance: { type: ["number", "null"] }
            avgRating: { type: number }
            ratingCount: { type: integer }
          required: [availableSpots, reservedSpots, occupiedSpots, avgRating, ratingCount]

    ParkingLotWithSpots:
      allOf:
        - $ref: "#/components/schemas/ParkingLot"
        - type: object
          properties:
            spots:
              type: array
              items:
                $ref: "#/components/schemas/Spot"
            avgRating: { type: number }
            ratingCount: { type: integer }
          required: [spots, avgRating, ratingCount]

    CreateLotBody:
      type: object
      properties:
        name: { type: string }
        location: { type: string }
        totalSpots: { type: integer }
        lat: { type: number }
        lng: { type: number }
        pricePerHour: { type: number }
      required: [name, location, totalSpots, lat, lng, pricePerHour]

    UpdateLotBody:
      type: object
      properties:
        name: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        pricePerHour: { type: ["number", "null"] }
        isActive: { type: ["boolean", "null"] }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }

    Spot:
      type: object
      properties:
        id: { type: integer }
        lotId: { type: integer }
        spotNumber: { type: string }
        status: { type: string }
      required: [id, lotId, spotNumber, status]

    UpdateSpotBody:
      type: object
      properties:
        status: { type: string, enum: [available, reserved, occupied] }
      required: [status]

    CreateReservationBody:
      type: object
      properties:
        spotId: { type: integer }
        startTime: { type: string }
        endTime: { type: string }
      required: [spotId, startTime, endTime]

    ReservationWithDetails:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        spotId: { type: integer }
        startTime: { type: string }
        endTime: { type: string }
        status: { type: string }
        totalPrice: { type: number }
        spotNumber: { type: string }
        lotId: { type: integer }
        lotName: { type: string }
        lotLocation: { type: string }
        lotLat: { type: number }
        lotLng: { type: number }
        userName: { type: string }
        userEmail: { type: string }
        userPhone: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, userId, spotId, startTime, endTime, status, totalPrice, spotNumber, lotId, lotName, lotLocation, lotLat, lotLng, userName, userEmail, createdAt]

    DashboardStats:
      type: object
      properties:
        totalSpots: { type: integer }
        availableSpots: { type: integer }
        reservedSpots: { type: integer }
        occupiedSpots: { type: integer }
        totalReservations: { type: integer }
        activeReservations: { type: integer }
        totalLots: { type: integer }
        totalUsers: { type: integer }
        totalRevenue: { type: number }
      required: [totalSpots, availableSpots, reservedSpots, occupiedSpots, totalReservations, activeReservations, totalLots, totalUsers, totalRevenue]

    Rating:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        lotId: { type: integer }
        reservationId: { type: ["integer", "null"] }
        stars: { type: integer }
        comment: { type: ["string", "null"] }
        createdAt: { type: string }
      required: [id, userId, lotId, stars, createdAt]

    RatingWithUser:
      allOf:
        - $ref: "#/components/schemas/Rating"
        - type: object
          properties:
            userName: { type: string }
          required: [userName]

    CreateRatingBody:
      type: object
      properties:
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: ["string", "null"] }
      required: [stars]

    RevenuePoint:
      type: object
      properties:
        date: { type: string }
        revenue: { type: number }
        bookings: { type: integer }
      required: [date, revenue, bookings]

    RevenueResponse:
      type: object
      properties:
        period: { type: string }
        total: { type: number }
        series:
          type: array
          items:
            $ref: "#/components/schemas/RevenuePoint"
      required: [period, total, series]

    PopularLot:
      type: object
      properties:
        lotId: { type: integer }
        lotName: { type: string }
        bookings: { type: integer }
        revenue: { type: number }
      required: [lotId, lotName, bookings, revenue]

    PeakHour:
      type: object
      properties:
        hour: { type: integer }
        bookings: { type: integer }
      required: [hour, bookings]
